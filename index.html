<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reflow</title>
    <style>
      html,
      body {
        margin: 0;
      }
      html {
        background: #f4efe6;
      }
      html.dark {
        background: #1a1714;
      }
      html.mica,
      html.overlay-window,
      body.overlay-window {
        background: transparent !important;
      }
    </style>
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var s = JSON.parse(localStorage.getItem("reflow_appearance") || "{}");
          var t = s.theme || "system";
          var isDark =
            t === "dark" ||
            (t === "system" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) root.classList.add("dark");
          var data = s.data || {};
          for (var k in data) root.dataset[k] = data[k];
          if (s.accentCustom) root.style.setProperty("--accent-custom", s.accentCustom);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased select-none font-sans overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
