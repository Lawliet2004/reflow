<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reflow</title>
    <style>
      html, body { margin: 0; }
      html { background: #f8fafc; }
      html.dark { background: #0b0f19; }
      html.overlay-window, body.overlay-window { background: transparent !important; }
    </style>
    <script>
      (function() {
        try {
          var t = localStorage.getItem("reflow_app_theme") || "system";
          var isDark = t === "dark" || (t === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) document.documentElement.classList.add("dark");
          var a = localStorage.getItem("reflow_accent") || "sky";
          document.documentElement.dataset.accent = a;
          var fs = localStorage.getItem("reflow_font_scale") || "normal";
          document.documentElement.dataset.fontScale = fs;
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased select-none font-sans overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
