name: Release installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  prepare-release:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      pack_matrix: ${{ steps.packs.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: packs
        shell: bash
        run: echo "matrix=$(python3 scripts/runtime-packs.py matrix)" >> "$GITHUB_OUTPUT"
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node scripts/release.cjs verify-version "$GITHUB_REF_NAME")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          node scripts/release.cjs draft-payload "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release.json"
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | [.id, .draft] | @tsv")
          if [ -n "$existing" ]; then
            read -r release_id is_draft <<< "$existing"
            if [ "$is_draft" != "true" ]; then
              echo "Refusing to overwrite an already published release" >&2
              exit 1
            fi
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              --input "$RUNNER_TEMP/release.json" > /dev/null
          else
            # Read the ID from the create response: a subsequent list can lag behind.
            release_id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              --input "$RUNNER_TEMP/release.json" --jq '.id')
          fi
          if ! [[ "$release_id" =~ ^[0-9]+$ ]]; then
            echo "Missing or invalid release ID" >&2
            exit 1
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          preview=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq '.prerelease')
          case "$preview" in true|false) ;; *) echo "Unknown release channel" >&2; exit 1 ;; esac
          echo "prerelease=$preview" >> "$GITHUB_OUTPUT"

  build-runtime-packs:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-release.outputs.pack_matrix) }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assemble binary wheelhouse and prove local installation without sockets
        shell: bash
        run: |
          python scripts/runtime-packs.py build '${{ matrix.target }}' '${{ matrix.profile }}' '${{ matrix.variant }}' \
            --output runtime-packs --cache "$RUNNER_TEMP/pbs-cache" --commit "$GITHUB_SHA"
      - name: Upload verified model-free pack to draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" runtime-packs/* --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: speech-runtime-${{ matrix.target }}-${{ matrix.profile }}-${{ matrix.variant }}
          path: runtime-packs/*.json
          if-no-files-found: error

  runtime-pack-catalog:
    needs: [prepare-release, build-runtime-packs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: speech-runtime-*
          path: runtime-pack-metadata
          merge-multiple: true
      - name: Bind this workflow's pack hashes and locks into the application catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/runtime-packs.py catalog runtime-pack-metadata "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" \
            "$GITHUB_SHA" model-runtime/runtime-packs.json --metadata-only
          gh release upload "$GITHUB_REF_NAME" model-runtime/runtime-packs.json --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-pack-catalog
          path: model-runtime/runtime-packs.json
          if-no-files-found: error

  publish-tauri:
    needs: [prepare-release, runtime-pack-catalog]
    name: Build ${{ matrix.name }} installer
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    env:
      # Presence gate only — the secret value itself is masked and only
      # forwarded to GITHUB_ENV on macOS when signing is configured.
      APPLE_CERTIFICATE_PRESENT: ${{ secrets.APPLE_CERTIFICATE }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            platform: ubuntu-22.04
            bundles: deb,appimage
            manifest_platform: linux
          - name: Windows
            platform: windows-latest
            bundles: nsis,msi
            manifest_platform: windows
          - name: macOS Apple Silicon preview
            platform: macos-latest
            bundles: dmg
            manifest_platform: macos-arm64
          - name: macOS Intel preview
            platform: macos-15-intel
            bundles: dmg
            manifest_platform: macos-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: runtime-pack-catalog
          path: model-runtime
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux bundle dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libgtk-layer-shell-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev libxdo-dev libssl-dev patchelf pkg-config
      - run: npm ci
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # This also covers the Intel Mac host, which is not in the reusable CI matrix.
      - name: Platform regressions before bundling
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --tests
      # Export Apple Developer ID credentials only when the secrets exist —
      # tauri-action imports the .p12 into a keychain and lets the bundler
      # codesign (APPLE_SIGNING_IDENTITY overrides the ad-hoc "-" in
      # tauri.conf.json) and notarize the DMG. Without them the macOS rows
      # stay ad-hoc signed, so fork builds keep working.
      - name: Configure Apple signing and notarization
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE_PRESENT != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          # The certificate is configured but no identity was given — the
          # config's ad-hoc "-" would be used, producing an unsigned/nearly-
          # unsigned build that fails verification. Fail fast instead.
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "APPLE_CERTIFICATE is set but APPLE_SIGNING_IDENTITY is empty." >&2
            echo "Add the secret, e.g. 'Developer ID Application: Name (TEAMID)'." >&2
            exit 1
          fi
          {
            echo 'APPLE_CERTIFICATE<<END-OF-CERTIFICATE'
            printf '%s\n' "$APPLE_CERTIFICATE"
            echo 'END-OF-CERTIFICATE'
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            # tauri-action creates its own keychain; give it a per-run password.
            echo "KEYCHAIN_PASSWORD=$(openssl rand -hex 16)"
          } >> "$GITHUB_ENV"
          echo "REFLOW_MACOS_SIGNED=true" >> "$GITHUB_ENV"
      - name: Build and upload desktop installers to draft
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          prerelease: ${{ needs.prepare-release.outputs.prerelease == 'true' }}
          tauriScript: ${{ runner.os == 'Linux' && 'node scripts/tauri-linux.cjs' || '' }}
          args: --bundles ${{ matrix.bundles }}
      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS' && env.REFLOW_MACOS_SIGNED == 'true'
        shell: bash
        run: |
          app=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -n1)
          test -n "$app" || { echo "No .app bundle found" >&2; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          # Tauri notarizes the .app bundle and staples the ticket onto it;
          # the dmg wrapper is not stapled, so stapler validates the .app.
          xcrun stapler validate "$app"
          dmg=$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' | head -n1)
          if [ -n "$dmg" ]; then
            codesign --verify --verbose=2 "$dmg"
          else
            echo "No .dmg found; skipping dmg signature check"
          fi
      - name: Native launcher smoke check
        shell: bash
        run: |
          binary=src-tauri/target/release/reflow
          if [ "$RUNNER_OS" = "Windows" ]; then binary="$binary.exe"; fi
          "$binary" --status > "$RUNNER_TEMP/reflow-startup.txt"
          grep -q 'Reflow' "$RUNNER_TEMP/reflow-startup.txt"
      - name: Record and upload desktop build provenance
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          PLATFORM: ${{ matrix.manifest_platform }}
        run: |
          manifest="$RUNNER_TEMP/build-$PLATFORM.json"
          node scripts/release.cjs build-manifest src-tauri/target/release/bundle "$VERSION" "$PLATFORM" "$manifest" model-runtime/runtime-packs.json
          gh release upload "$GITHUB_REF_NAME" "$manifest" --clobber

  publish-android:
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK and run Android regressions
        working-directory: android
        run: >-
          java -classpath gradle/wrapper/gradle-wrapper.jar
          org.gradle.wrapper.GradleWrapperMain --no-daemon --console=plain
          testDebugUnitTest lintRelease assembleRelease
      - name: Sign, verify and upload Android companion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/reflow-release.jks"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          apk="$RUNNER_TEMP/Reflow-$VERSION-android.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/reflow-release.jks" --ks-key-alias reflow \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --out "$apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose "$apk"
          manifest="$RUNNER_TEMP/build-android.json"
          node scripts/release.cjs build-manifest "$RUNNER_TEMP" "$VERSION" android "$manifest"
          gh release upload "$GITHUB_REF_NAME" "$apk" "$manifest" --clobber

  publish-release:
    needs: [prepare-release, publish-tauri, publish-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reserve disk for verification of the complete runtime matrix
        run: |
          # This verification-only hosted runner needs neither Android nor
          # .NET/Haskell/CodeQL. Retain room for every actual release archive.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h .
      - name: Verify installers and enforce the selected release channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          PREVIEW: ${{ needs.prepare-release.outputs.prerelease }}
        run: |
          gh release download "$GITHUB_REF_NAME" --dir release-downloads
          python3 scripts/runtime-packs.py catalog release-downloads "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" \
            "$GITHUB_SHA" "$RUNNER_TEMP/verified-runtime-packs.json"
          cmp release-downloads/runtime-packs.json "$RUNNER_TEMP/verified-runtime-packs.json"
          node scripts/release.cjs verify-assets release-downloads "$VERSION"
          preview="$PREVIEW"
          case "$preview" in
            true) echo "Publishing an explicitly selected preview; physical acceptance remains pending." ;;
            false) node scripts/acceptance.cjs release-downloads "$VERSION" "$GITHUB_SHA" ;;
            *) echo "Unknown release channel; refusing publication" >&2; exit 1 ;;
          esac
          gh release upload "$GITHUB_REF_NAME" release-downloads/SHA256SUMS.txt --clobber
          if [ "$preview" = "true" ]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --latest=false
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          fi
