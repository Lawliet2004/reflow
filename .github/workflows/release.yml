name: Release installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  publish-tauri:
    needs: validate
    name: Build ${{ matrix.name }} installer
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            platform: ubuntu-22.04
            bundles: deb,appimage
          - name: Windows
            platform: windows-latest
            bundles: nsis,msi
          # macOS remains a compile/test target in ci.yml. Public installers are
          # gated until native dictation/hotkey/startup parity is verified.

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux bundle dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            pkg-config

      - name: Install frontend dependencies
        run: npm ci

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Frontend lint
        run: npm run lint
      - name: Frontend regressions
        run: npm run test
      - name: Packaging and scoped shutdown regressions
        run: node --test scripts/package.test.cjs scripts/kill-running.test.cjs
      - name: Rust regressions before creating draft installers
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --tests

      - name: Build and publish installers
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Reflow ${{ github.ref_name }}
          releaseBody: |
            Download the installer for your operating system below.

            - Linux: `.deb` or `.AppImage`
            - Windows: `.msi` or NSIS `.exe`
            Linux X11 supports clipboard injection. On Wayland, compositor permissions/tools can require manual paste.
            macOS development builds currently offer clipboard/manual-copy fallback and are not included as supported dictation installers.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          releaseAssetNamePattern: Reflow-[platform]-[arch][ext]
          args: --bundles ${{ matrix.bundles }}
